name: Publish Release

# Downloads a build artifact (e.g. an EAS build's .apk/.ipa download URL,
# which isn't guaranteed to stay valid indefinitely) and publishes it as a
# GitHub Release asset on this repo. Runs entirely inside the job — this
# repo's auto-provided GITHUB_TOKEN already has write access to itself, so
# no cross-repo credential is needed.
#
# Uses a fixed tag by default ("android-latest"), overwriting that
# release's asset each run (--clobber), so the public download link never
# changes across future releases.
on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: "Direct download URL of the build artifact"
        required: true
      asset_name:
        description: "Filename to publish it as"
        required: true
        default: "awaken-church.apk"
      tag:
        description: "Release tag to create or update"
        required: true
        default: "android-latest"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        run: curl -sSL --fail "${{ inputs.artifact_url }}" -o "${{ inputs.asset_name }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.tag }}" "${{ inputs.asset_name }}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ inputs.tag }}" "${{ inputs.asset_name }}" \
              --repo "${{ github.repository }}" \
              --title "Awaken Church — Android" \
              --notes "Direct-install Android APK. This link stays stable across future releases."
          fi
